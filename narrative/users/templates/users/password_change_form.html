{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change password - Narrative AI</title>
    <link rel="stylesheet" href="{% static 'users/css/password_change_form.css' %}">
    <link rel="stylesheet" href="{% static 'css/topbar.css' %}">
</head>
<body>
{% include "partials/topbar.html" with active="profile" %}
    <div class="form-container">
        <!-- Кнопка назад -->
        <a href="{% url 'users:profile' %}" class="back-btn">
            <svg viewBox="0 0 24 24">
                <path d="M20 12H4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M10 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>

        <h1>Change password</h1>

        <form method="post">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="form-error">{{ form.non_field_errors }}</div>
            {% endif %}

            {% for f in form %}
                <label for="{{ f.id_for_label }}">{{ f.label }}</label>
                {{ f }}
                {% if f.errors %}
                    <div class="form-error">{{ f.errors }}</div>
                {% endif %}
            {% endfor %}

            <button type="submit">Change password</button>
        </form>

    </div>
</body>
</html>
