{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an account - Narrative AI</title>
    <link rel="stylesheet" href="{% static 'users/css/register.css' %}">
</head>
<body>
    <div class="auth-brand">✦ Narrative AI</div>
    <div class="form-container">
        <h1>Create an account</h1>

        <form method="post">
            {% csrf_token %}

            {% if form.non_field_errors %}
            <div class="form-error">{{ form.non_field_errors }}</div>
            {% endif %}

            {% for f in form %}
                <label for="{{ f.id_for_label }}">{{ f.label }}</label>
                {{ f }}
                {% if f.errors %}
                    <div class="form-error">{{ f.errors }}</div>
                {% endif %}
            {% endfor %}

            <button type="submit">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{% url 'users:login' %}">Log in</a></p>
    </div>
</body>
</html>
