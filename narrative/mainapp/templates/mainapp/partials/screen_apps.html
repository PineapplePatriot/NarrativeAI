<section class="screen-app-view" id="app-home" aria-label="Home screen">
  <div class="screen-home">
    <header class="screen-home-top"><span class="screen-wordmark">narrative<span> / screen</span></span>
      <label class="screen-wallpaper-label">Wallpaper <select id="screenWallpaper" aria-label="Wallpaper">
        <option value="dusk">Dusk</option><option value="forest">Forest</option>
        <option value="clay">Clay</option><option value="midnight">Midnight</option>
      </select></label>
    </header>
    <div class="screen-home-clock"><time id="screenHomeTime">--:--</time><p id="screenHomeDate"></p></div>
    <div class="screen-home-heading"><p class="screen-eyebrow">YOUR SPACE</p><h1>A little closer to your world.</h1>
      <p>Pick up a conversation, keep a plan, or see what everyone is sharing.</p></div>
    <nav class="screen-app-grid" id="screenAppGrid" aria-label="Apps"></nav>
    <div class="screen-home-widgets"><section class="screen-widget"><div class="screen-section-label">PICK UP WHERE YOU LEFT OFF</div>
      <div id="screenRecentChats"></div></section>
      <section class="screen-widget"><div class="screen-section-label">ON YOUR DESK</div><div id="screenDeskSummary"></div>
        <p class="screen-muted">Your saved work stays here. Open an app whenever you’re ready.</p></section></div>
    <p class="screen-home-footer">TeleChat · stories · everything in between</p>
  </div>
</section>
<section class="screen-app-view" id="app-mail" aria-label="Mail"><div id="screenMailRoot" class="screen-mini-root"></div></section>
<section class="screen-app-view" id="app-pulse" aria-label="Pulse calendar"><div id="screenPulseRoot" class="screen-mini-root"></div></section>
<section class="screen-app-view" id="app-wave" aria-label="Wave playlist and voice archive"><div id="screenWaveRoot" class="screen-mini-root"></div></section>
<div id="screenAppStatus" role="status" hidden></div>
